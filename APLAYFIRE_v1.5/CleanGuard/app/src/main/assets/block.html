*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(120% 80% at 50% 0,#5a0f16,#1a0508 60%,#0b0204);color:#fff;font:15px/1.5 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;overflow:hidden;position:relative}
body::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);animation:sc 8s linear infinite}
@keyframes sc{to{background-position:0 80px}}
.ic{position:relative;width:150px;height:150px;display:grid;place-items:center;margin-bottom:18px}
.ic i{position:absolute;inset:20px;border-radius:50%;border:1px solid rgba(255,90,90,.7);animation:wv 2.4s ease-out infinite}.ic i:nth-child(2){animation-delay:.8s}.ic i:nth-child(3){animation-delay:1.6s}
@keyframes wv{from{transform:scale(.6);opacity:1}to{transform:scale(1.7);opacity:0}}
.sh{width:84px;height:84px;background:#fff;-webkit-mask:var(--shield) center/contain no-repeat;mask:var(--shield) center/contain no-repeat;animation:shake .7s .2s both,glow 2.4s 1s infinite;filter:drop-shadow(0 0 18px rgba(255,70,70,.8))}
@keyframes shake{20%{transform:translateX(-9px) rotate(-5deg)}40%{transform:translateX(8px) rotate(4deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes glow{50%{filter:drop-shadow(0 0 32px rgba(255,70,70,1))}}
.tag{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#ff8a8a;border:1px solid rgba(255,138,138,.5);border-radius:99px;padding:3px 14px;animation:up .6s .3s both}
h1{font-size:25px;font-weight:300;margin:12px 0 4px;animation:tx 1s .4s both}
@keyframes tx{from{opacity:0;letter-spacing:6px;filter:blur(6px)}}
.nm{color:#ffb3b3;word-break:break-all;margin:0 0 14px;animation:up .6s .5s both}
ul{list-style:none;margin:0 0 24px;padding:0;max-width:360px;width:100%;text-align:left}
li{padding:10px 14px;margin-bottom:8px;border:1px solid rgba(255,255,255,.14);border-left:3px solid #ff5a5a;border-radius:10px;background:rgba(255,255,255,.05);font-size:14px;animation:up .6s both;animation-delay:calc(.7s + var(--i)*.18s)}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
button{font:inherit;border:0;border-radius:99px;padding:15px 22px;width:100%;max-width:360px;font-weight:700;position:relative;overflow:hidden;animation:up .6s 1s both}
#deny{background:#fff;color:#7d0d13;margin-bottom:12px}
#allow{background:transparent;color:#ffb3b3;border:1px solid rgba(255,179,179,.5)}
#allow i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,90,90,.28);animation:fill 3.5s 1.2s linear forwards}
@keyframes fill{to{width:100%}}
#allow:disabled{opacity:.7}
#allow span{position:relative}
</style></head><body>
<div class="ic"><i></i><i></i><i></i><div class="sh"></div></div>
<div class="tag" id="tag"></div><h1 id="ti"></h1><p class="nm" id="nm"></p><ul id="ul"></ul>
<button id="deny"></button><button id="allow" disabled><i></i><span></span></button>
<script>
var DICT={'Download suspeito':['Suspicious download','Descarga sospechosa'],'App suspeito instalado':['Suspicious app installed','App sospechosa instalada'],'Site suspeito bloqueado':['Suspicious site blocked','Sitio sospechoso bloqueado'],'Perigo':['Danger','Peligro'],'Atenção':['Warning','Atención'],'Não baixar (apagar)':['Do not keep (delete)','No conservar (borrar)'],'Desinstalar':['Uninstall','Desinstalar'],'Não acessar':['Do not visit','No acceder'],'Aceitar o risco e manter':['Accept the risk and keep','Aceptar el riesgo y conservar'],'Aceitar o risco e entrar':['Accept the risk and enter','Aceptar el riesgo y entrar'],'Aguarde':['Wait','Espera']};
var L='pt';function t(s){return L=='pt'||!DICT[s]?s:DICT[s][L=='en'?0:1]}
function init(d){L=d.lang||'pt';var k=d.kind,web=k=='web';
  document.getElementById('tag').textContent=t(d.level>=2?'Perigo':'Atenção');
  document.getElementById('ti').textContent=t(web?'Site suspeito bloqueado':k=='app'?'App suspeito instalado':'Download suspeito');
  document.getElementById('nm').textContent=d.name;
  document.getElementById('ul').innerHTML=d.w.map(function(x,i){var l=document.createElement('li');l.style.setProperty('--i',i);l.textContent=x;return l.outerHTML}).join('');
  document.getElementById('deny').textContent=t(web?'Não acessar':k=='app'?'Desinstalar':'Não baixar (apagar)');
  var a=document.getElementById('allow');a.querySelector('span').textContent=t(web?'Aceitar o risco e entrar':'Aceitar o risco e manter');
  setTimeout(function(){a.disabled=false;a.style.opacity=1},4700);
  document.getElementById('deny').onclick=function(){window.Blk?Blk.deny():alert('deny')};
  a.onclick=function(){window.Blk?Blk.allow():alert('allow')}}
if(!window.Blk)init({kind:'web',name:'banco-seguro-login.tk',level:2,lang:'pt',w:['Imita a marca itau','Extensão de domínio muito usada em golpes','Bloqueado pelo filtro de ameaças (Cloudflare)']});
</script></body></html>
