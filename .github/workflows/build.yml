
name: Build AplayFire v1.5 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "APLAYFIRE_v1.5 (1)/CleanGuard"

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verificar estrutura do projeto
        run: |
          echo "Verificando CleanGuard v1.5..."
          pwd
          ls -la
          test -f settings.gradle.kts
          test -d app

      - name: Configurar permissões do Gradle
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Localizar APK
        run: |
          echo "APKs gerados:"
          find app/build/outputs/apk -name "*.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AplayFire-v1.5-APK
          path: APLAYFIRE_v1.5 (1)/CleanGuard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
